syntax = "proto3";

package db_pod;

option go_package = "burstkv/internal/db_pod/db_pod_pb";

service DBPod {
  rpc ResumeDatabase(ResumeDatabaseRequest) returns (Empty);
  rpc ReplicateDatabase(ReplicateDatabaseRequest) returns (Empty);
  rpc MigrateDatabase(MigrateDatabaseRequest) returns (Empty);
  rpc CreateDatabase(CreateDatabaseRequest) returns (Empty);
  rpc Stop(StopRequest) returns (Empty);
}

message Empty {}

message StopRequest {
  bool save = 1;
}

message ResumeDatabaseRequest {
  string database_id = 1;
  string get_url = 2;
}

message CreateDatabaseRequest {
  string database_id = 1;
}

message MigrateDatabaseRequest {
  string newAddress = 1;
}

message ReplicateDatabaseRequest {
  string database_id = 1;
  string replica_address = 2;
}