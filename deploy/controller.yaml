apiVersion: apps/v1
kind: Deployment
metadata:
  name: burstkv-controller
spec:
  replicas: 1
  selector:
    matchLabels: { burstkv/role: controller }
  template:
    metadata:
      labels: { burstkv/role: controller }
    spec:
      serviceAccountName: burstkv-controller
      containers:
      - name: controller
        image: burstkv-controller 
        imagePullPolicy: Never # Assume images are built locally
        ports:
        - { name: grpc, containerPort: 6381 }

---
apiVersion: v1
kind: Service
metadata:
  name: burstkv-controller
spec:
  selector: { burstkv/role: controller }
  ports:
  - { name: grpc, port: 6381, targetPort: grpc }

---
apiVersion: v1
kind: Service
metadata:
  name: burstkv-public
spec:
  type: LoadBalancer
  selector: {burstkv/role: controller}
  ports:
  - { name: http,  port: 6378, targetPort: http }
  - { name: redis, port: 6379, targetPort: redis }


---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: burstkv-controller

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: burstkv-controller
rules:
- apiGroups: [""]         
  resources: ["pods"]
  verbs: ["list", "update", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: burstkv-controller
subjects:
- kind: ServiceAccount
  name: burstkv-controller
roleRef:
  kind: Role
  name: burstkv-controller
  apiGroup: rbac.authorization.k8s.io