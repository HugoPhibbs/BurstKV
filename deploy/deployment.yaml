apiVersion: apps/v1
kind: Deployment
metadata:
  name: burstkv-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { burstkv/role: controller }
  template:
    metadata:
      labels: { burstkv/role: controller }
    spec:
      serviceAccountName: burstkv-controller
      containers:
      - name: controller
        image: burstkv-controller 
        imagePullPolicy: Never # Assume images are built locally
        ports:
        - { name: redis, containerPort: 6379 }
        - { name: grpc, containerPort: 6381 }
        args:
        - --storage-address=host.minikube.internal:9000
        - --access-key=default-ak
        - --secret-key=default-sk

---
apiVersion: v1
kind: Service
metadata:
  name: burstkv-controller
spec:
  selector: { burstkv/role: controller }
  ports:
  - { name: redis, port: 6379, targetPort: redis}
  - { name: grpc, port: 6381, targetPort: grpc }

---
apiVersion: v1
kind: Service
metadata:
  name: burstkv-public
spec:
  type: LoadBalancer
  selector: {burstkv/role: controller}
  ports:
  - { name: grpc,  port: 6381, targetPort: grpc }
  - { name: redis, port: 6379, targetPort: redis }


---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: burstkv-controller

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: burstkv-controller
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "update", "delete"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods"]
  verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: burstkv-controller
subjects:
- kind: ServiceAccount
  name: burstkv-controller
roleRef:
  kind: Role
  name: burstkv-controller
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: burstkv-warm
spec:
  replicas: 10
  selector:
    matchLabels: { burstkv/role: warm }
  template:
    metadata:
      labels: { burstkv/role: warm }
    spec:
      containers:
      - name: redis
        image: burstkv-dbpod:latest
        imagePullPolicy: Never # Local image build
        env:
          - name: REDIS_PORT
            value: "6379"
          - name: GRPC_PORT
            value: "6380"
          - name: CONTROLLER_GRPC_ADDRESS
            value: "burstkv-controller:6381"
        resources: # Each pod gets exactly the limit for QoS
          requests: { memory: 64Mi, cpu: 50m } 
          limits:   { memory: 64Mi, cpu: 50m }
        resizePolicy:
        - { resourceName: memory, restartPolicy: NotRequired }