apiVersion: apps/v1
kind: Deployment
metadata:
  name: burstkv-warm
spec:
  replicas: 10
  selector:
    matchLabels: { burstkv/role: warm }
  template:
    metadata:
      labels: { burstkv/role: warm }
    spec:
      containers:
      - name: redis
        image: burstkv-dbpod:latest
        imagePullPolicy: Never # Local image build
        env:
          - name: REDIS_PORT
            value: "6379"
          - name: GRPC_PORT
            value: "6380"
          - name: CONTROLLER_GRPC_ADDRESS
            value: "burstkv-controller:6381"
        resources: # Each pod gets exactly the limit for QoS
          requests: { memory: 64Mi, cpu: 50m } 
          limits:   { memory: 64Mi, cpu: 50m }
        resizePolicy:
        - { resourceName: memory, restartPolicy: NotRequired }